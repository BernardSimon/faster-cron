# tasks.yaml - FasterCron 任务配置文件示例

tasks:
  # 1. 每秒心跳检测（高频任务）
  - module: faster_cron.example_tasks
    function: heartbeat
    expression: "* * * * * *"   # 每秒
    allow_overlap: true

  # 2. 每分钟检查服务健康状态
  - module: faster_cron.example_tasks
    function: health_check
    expression: "*/2 * * * * *"  # 每 2 秒
    allow_overlap: true

  # 3. 每小时清理临时文件
  - module: faster_cron.example_tasks
    function: clean_temp_files
    expression: "*/3 * * * * *"  # 每 3 秒
    allow_overlap: false

  # 4. 每日凌晨备份任务
  - module: faster_cron.example_tasks
    function: nightly_backup
    expression: "*/5 * * * * *"  # 每 5 秒
    allow_overlap: false
