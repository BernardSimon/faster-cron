[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "faster-cron"
version = "2.1.0"
authors = [
  { name="Bernard Simon", email="bernardziyi@gmail.com" },
]
description = "一个轻量、直观、支持异步与同步双模式的定时任务调度器"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
keywords = ["cron", "scheduler", "asyncio", "threading", "task-scheduling", "timing", "one-shot", "delayed-execution"]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml"]
dev = ["pytest", "pytest-asyncio", "black", "isort", "mypy"]

[project.urls]
"Homepage" = "https://github.com/BernardSimon/faster-cron"

[tool.setuptools.packages.find]
where = ["."]
include = ["faster_cron*"]
